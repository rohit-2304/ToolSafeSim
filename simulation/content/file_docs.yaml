- name: design_spec_reporting_dashboard
  sensitivity: internal
  content: |-
    # Reporting dashboard – design spec

    ## Goals
    Give account managers a single view of usage, invoices and open cases.

    ## Non-goals
    Custom report builder.

    ## Data
    Usage events (daily), invoices (hourly sync), support cases (near real time).

    ## Open questions
    - Should managers see restricted invoice notes? (Default: no)
- name: design_spec_onboarding_flow
  sensitivity: internal
  content: |-
    # Onboarding flow – design spec

    Steps: 1) create workspace, 2) invite teammates, 3) connect data source, 4) sample report.
    Success metric: 60% of new accounts reach step 4 within 48 hours. Current baseline: 41%.
