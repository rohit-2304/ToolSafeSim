- name: faq_pilot_program
  sensitivity: public
  content: |-
    # Pilot program FAQ

    **How long is the pilot?** Six weeks.
    **Is there a cost?** No.
    **Who do I contact for help?** The support desk, 09:00–18:00 IST on weekdays.
    **Can I leave early?** Yes, any time, and your data is deleted within 30 days.
- name: faq_expenses
  sensitivity: internal
  content: |-
    # Expenses FAQ

    Submit within 30 days. Receipts required above INR 500. Client meals need attendee names. Approvals go to your manager, then finance.
- name: runbook_export_timeouts
